port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies: []
proxy-groups:
- name: 节点选择
  type: select
  proxies: &id001
  - DIRECT
- name: 自动选择
  type: url-test
  proxies: *id001
  url: http://www.gstatic.com/generate_204
  interval: 300
rules:
- GEOIP,CN,DIRECT
- MATCH,节点选择
