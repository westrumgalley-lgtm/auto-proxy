name: Auto Fetch Nodes

on:
  schedule:
    # 每 6 小时自动运行一次 (UTC时间)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持网页手动点击运行

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        run: |
          python main.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dist/sub.txt
          git diff --staged --quiet || git commit -m "Auto update nodes $(date '+%Y-%m-%d %H:%M:%S')"
          git push